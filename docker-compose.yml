version: '3.8'

services:
  # The Qdrant Vector Engine Container
  qdrant:
    image: qdrant/qdrant:latest
    container_name: MetaGraph-qdrant
    ports:
      - "6333:6333" # REST API & Dashboard
      - "6334:6334" # gRPC API
    volumes:
      - qdrant_storage:/qdrant/storage

  # MetaGraph-MCP Control Plane & MCP Server
  MetaGraph-context:
    build: .
    container_name: MetaGraph-context-app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - qdrant

volumes:
  qdrant_storage: