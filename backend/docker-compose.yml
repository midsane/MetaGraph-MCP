services:
  # Simulates the external company database that owns the live business data.
  # MetaGraph only ever reads this via the PostgresConnector.
  business-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: business_admin
      POSTGRES_PASSWORD: business_password123
      POSTGRES_DB: business
    ports:
      - "5433:5432"
    volumes:
      - business_pg_data:/var/lib/postgresql/data
      - ./src/db/init-target-db.sql:/docker-entrypoint-initdb.d/1-init-target.sql

  adminer:
    image: adminer
    ports:
      - "8080:8080"

  # MetaGraph's own catalog store: tables, columns, PII tags, sync watermark.
  catalog-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: metagraph
    ports:
      - "5434:5432"
    volumes:
      - catalog_pg_data:/var/lib/postgresql/data
      - ./src/db/init-catalog.sql:/docker-entrypoint-initdb.d/1-init-catalog.sql

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/password123
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt port for Node.js
    volumes:
      - neo4j_data:/data

volumes:
  business_pg_data:
  catalog_pg_data:
  qdrant_data:
  neo4j_data:
